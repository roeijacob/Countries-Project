<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flag Memory Game | Hello World</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/games.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../js/config.js" defer></script>
    <script src="../js/utilities.js" defer></script>
    <script src="../js/ajaxCalls.js" defer></script>
    <script src="../js/authentication.js" defer></script>
    <script src="../js/navigation.js" defer></script>
    <script src="../js/memory-game.js" defer></script>
</head>

<body class="games-page">
    <nav id="mainNavigation"
         class="navigation-shell"
         aria-label="Main navigation"></nav>

    <main class="game-shell">
        <header class="game-header">
            <div>
                <h1>Flag Memory Game</h1>
                <p>
                    Match every flag with its country name.
                </p>
            </div>
        </header>

        <div id="memoryGameStatus"
             class="status-message"
             aria-live="polite"></div>

        <section class="game-stats-bar">
            <div class="game-stat">
                <strong id="memoryTimer">70</strong>
                <span>Seconds</span>
            </div>

            <div class="game-stat">
                <strong id="memoryMoves">0</strong>
                <span>Moves</span>
            </div>

            <div class="game-stat">
                <strong id="memoryMatchedPairs">0</strong>
                <span>Matched pairs</span>
            </div>

            <div class="game-stat">
                <strong id="memoryPoints">0</strong>
                <span>Points</span>
            </div>
        </section>

        <section id="memoryBoard"
                 class="memory-board card"
                 aria-label="Memory game board"></section>

        <div id="memoryResultOverlay" class="game-result-overlay" hidden>
            <section id="memoryResultPanel" class="game-result-panel card" role="dialog" aria-modal="true" aria-labelledby="memoryResultTitle">
                <h2 id="memoryResultTitle">Game Complete</h2>
                <p id="memoryResultText"></p>
                <div id="memorySaveMessage" class="status-message" aria-live="polite"></div>
                <div class="game-result-actions">
                    <button id="memoryReplayButton" type="button">Replay</button>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
