<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Hello World</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/authentication.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../js/config.js" defer></script>
    <script src="../js/utilities.js" defer></script>
    <script src="../js/ajaxCalls.js" defer></script>
    <script src="../js/authentication.js" defer></script>
</head>

<body>

    <div class="authentication-messages">
        <div id="lockedAccountMessage"
             class="status-message"
             aria-live="polite"></div>

        <div id="authenticationStatus"
             class="status-message"
             aria-live="polite"></div>
    </div>

    <main class="authentication-page">
        <section class="authentication-card card"
                 aria-labelledby="loginTitle">

            <header class="authentication-header">
                <h1 id="loginTitle">Login</h1>
                <p>
                    Log in to manage your travel lists,
                    reviews, games, and profile.
                </p>
            </header>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="loginEmail">Email</label>

                    <input id="loginEmail"
                           name="email"
                           type="email"
                           autocomplete="email"
                           required>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>

                    <div class="password-container">
                        <input id="loginPassword"
                               name="password"
                               type="password"
                               autocomplete="current-password"
                               required>

                        <button class="password-toggle-icon"
                                type="button"
                                data-password-target="loginPassword"
                                aria-label="Hold to show password">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                                <path d="M4 4l16 16"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <button class="authentication-submit"
                        type="submit">
                    Login
                </button>
            </form>

            <p class="authentication-switch">
                New here?
                <a href="register.html">Create an account</a>
            </p>
        </section>
    </main>
</body>
</html>
